  .bar { fill: #2a78d6; }
  .line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: #2a78d6; fill-opacity: 0.10; }
  .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink-1 { fill: #ffffff; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .bar { fill: #3987e5; }
    .line { stroke: #3987e5; }
    .area { fill: #3987e5; }
    .dot { fill: #3987e5; stroke: #1a1a19; }
  }
</style>
