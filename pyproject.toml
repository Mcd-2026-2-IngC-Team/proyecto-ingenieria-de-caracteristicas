[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "project_name"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "geopandas>=1.1",
    "httpx2>=2.12.0",
    "loguru",
    "marimo>=0.24.0",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pip",
    "pyogrio>=0.11",
    "pytest",
    "python-dotenv",
    # >=6.0.2 (not 6.0.3): paddleocr>=3.7 (in the "ocr" extra) pins pyyaml==6.0.2 exactly.
    "pyyaml>=6.0.2",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"

[project.optional-dependencies]
ocr = [
    "paddleocr[doc-parser]>=3.7",
    # PaddleOCR-VL got native transformers support 2025-12-11 (no more
    # trust_remote_code) via AutoModelForImageTextToText - require at least
    # that so we use the bundled, tested modeling code instead of the Hub's
    # custom code, which drifts out of sync with whatever transformers you
    # have installed (hit in practice: see project_name/clients/ocr.py).
    "transformers>=4.58",
    "pillow",
    "einops",
    "protobuf",
    "sentencepiece",
]
# torch va en su propio extra para elegir de dónde se instala: `cpu` es el de
# PyPI (Mac, Linux con CPU o NVIDIA) y `rocm` el de PyTorch para GPUs AMD
# (Yuca). Se usan junto con `ocr`: `uv sync --extra ocr --extra cpu|rocm`.
cpu = ["torch>=2.4", "torchvision"]
rocm = [
    "torch>=2.4",
    "torchvision",
    # Dependencia de torch ROCm; se declara aquí para que uv la busque en el
    # mismo índice (las fuentes de uv solo aplican a dependencias directas).
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }]]

# ROCm solo publica ruedas para Linux x86_64; en otras plataformas `rocm` cae a PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff]
line-length = 99
src = ["project_name"]
include = ["pyproject.toml", "project_name/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["project_name"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "ruff>=0.16.5",
]

