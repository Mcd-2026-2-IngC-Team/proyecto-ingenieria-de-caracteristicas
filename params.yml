logging:
  level: "INFO"
  file: "logs/project_name.log"
  console: false

sources:
  inegi:
    name: "Instituto Nacional de Estadística y Geografía"
    url: "https://www.inegi.org.mx"
    license: "Términos de Libre Uso de la Información del INEGI: https://www.inegi.org.mx/inegi/terminos.html"
    datasets:
      dcah_2025:
        name: "Delimitación de colonias y otros asentamientos humanos 2025"
        # Solo existe como paquete nacional (~556 MB) con un ZIP por estado; con
        # descargas por rango bajamos únicamente `state_member` (~15 MB).
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/delimitaciones/794551163078_s.zip"
        state_member: "26_sonora.zip"
        description: >-
          Polígonos de colonias, fraccionamientos y otros asentamientos humanos,
          entregados y validados por cada municipio e integrados por el INEGI (en
          Hermosillo los entrega la Dirección de Catastro; actualización 11/2025). Una
          fila por asentamiento: clave geoestadística; claves de entidad, municipio,
          localidad y asentamiento; código postal; fecha de actualización; institución
          que lo entregó; nombre y tipo (colonia, fraccionamiento, residencial...).
          Proyección EPSG:6372 (Cónica Conforme de Lambert sobre ITRF2008, en metros).
          El ZIP de Sonora trae la capa 26as (shapefile), el catálogo de asentamientos
          (catalogos/, nacional, en UTF-8), la descripción de campos
          (catalogos/contenido.txt) y los metadatos (metadatos/, en ISO-8859-1).
        documentation:
          - "https://www.inegi.org.mx/programas/dcah/"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=794551163078"
          - "https://inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/nueva_estruc/889463920076.pdf"

        raw:
          directory: "data/raw/inegi/dcah"
          filename: "dcah_2025_26_sonora.zip"

        interim:
          directory: "data/interim/inegi/dcah"

      mg_2025_sonora:
        name: "Marco Geoestadístico 2025 — Sonora"
        # Paquete estatal (~73 MB) con todas las capas; bajamos por rango solo las
        # que usamos. La capa 26e son los ejes de vialidad (calles con su nombre).
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/794551163061/26_sonora.zip"
        streets_members:
          - "conjunto_de_datos/26e.shp"
          - "conjunto_de_datos/26e.shx"
          - "conjunto_de_datos/26e.dbf"
          - "conjunto_de_datos/26e.prj"
          - "conjunto_de_datos/26e.CPG"
          # Metadato oficial del paquete de Sonora (20 KB).
          - "metadatos/mg_2025_26.txt"
        description: >-
          Ejes de vialidad (capa 26e) del Marco Geoestadístico 2025 de Sonora: una línea
          por tramo de calle. Campos: CVEGEO (clave geoestadística del tramo); CVE_ENT,
          CVE_MUN y CVE_LOC (entidad, municipio y localidad); CVEVIAL y CVESEG (claves de
          la vialidad y del segmento); NOMVIAL (nombre); TIPOVIAL (tipo: Calle, Avenida,
          Retorno...); SENTIDO y TIPOSEN (sentido de circulación) y AMBITO (urbana o
          rural). Proyección Cónica Conforme de Lambert sobre ITRF2008, en metros:
          equivale a EPSG:6372, aunque su .prj la nombra distinto. Del paquete estatal
          (~73 MB, con todas las capas) solo se descargan los archivos de esta capa y
          el metadato oficial (mg_2025_26.txt).
        documentation:
          - "https://www.inegi.org.mx/temas/mg/"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=794551163061"

        raw:
          directory: "data/raw/inegi/mg"

      # Actualmente cada subcuenca se descarga de manera independiente. Se podría reducir 
      # el código y las descargas realizando una sola descarga del paquete que contiene 
      # las cuencas de Sonora y extrayendo únicamente las carpetas correspondientes a las subcuencas utilizadas.
      subc_la_poza:
        name: "Red hidrográfica. Escala 1:50 000. Edición 2.0. Subcuenca hidrográfica RH09Di A. La Poza. Cuenca R. Sonora. RH Sonora Sur"
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/hidrogeolo/subcuencas_2.0/889463135449_s.zip"
        description: >-
          Red hidrográfica de la subcuenca La Poza, correspondiente a la región 
          hidrológica 09 Sonora Sur: conjunto de capas geoespaciales que representan 
          las líneas de flujo, puntos de drenaje, cuerpos de agua, unidad de captación 
          a nivel subcuenca y topónimos. La capa _hl representa los segmentos de la 
          red hidrográfica; _dr, los puntos de drenaje; _ha, los polígonos de cuerpos 
          de agua; _subc, el límite de la unidad de captación a nivel subcuenca; y _to, 
          los puntos con información de nombres geográficos.
        documentation:
          - "https://www.inegi.org.mx/temas/hidrografia/#mapas"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=889463135449"

        raw:
          directory: "data/raw/inegi/subc_la_poza"
          filename: "subc_la_poza.zip"

        interim:
          directory: "data/interim/inegi/subc_la_poza"
          key: "subc_la_poza"

        processed:
          directory: "data/processed/inegi/subc_la_poza"
          filename: "subc_la_poza.gpkg"
        
      subc_r_son_hillo:
        name: "Red hidrográfica. Escala 1:50 000. Edición 2.0. Subcuenca hidrográfica RH09Da R. Sonora - Hermosillo. Cuenca R. Sonora. RH Sonora Sur"
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/hidrogeolo/subcuencas_2.0/889463135579_s.zip"
        description: >-
          Red hidrográfica de la subcuenca Río Sonora-Hillo, correspondiente a la región 
          hidrológica 09 Sonora Sur: conjunto de capas geoespaciales que representan 
          las líneas de flujo, puntos de drenaje, cuerpos de agua, unidad de captación 
          a nivel subcuenca y topónimos. La capa _hl representa los segmentos de la 
          red hidrográfica; _dr, los puntos de drenaje; _ha, los polígonos de cuerpos 
          de agua; _subc, el límite de la unidad de captación a nivel subcuenca; y _to, 
          los puntos con información de nombres geográficos.
        documentation:
          - "https://www.inegi.org.mx/temas/hidrografia/#mapas"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=889463135579"

        raw:
          directory: "data/raw/inegi/subc_r_son_hillo"
          filename: "subc_r_son_hillo.zip"

        interim:
          directory: "data/interim/inegi/subc_r_son_hillo"
          key: "subc_r_son_hillo"

        processed:
          directory: "data/processed/inegi/subc_r_son_hillo"
          filename: "subc_r_son_hillo.gpkg"
        
      subc_la_manga:
        name: "Red hidrográfica. Escala 1:50 000. Edición 2.0. Subcuenca hidrográfica RH09Eb A. La Manga. Cuenca R. Bacoachi. RH Sonora Sur"
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/hidrogeolo/subcuencas_2.0/889463135586_s.zip"
        description: >-
          Red hidrográfica de la subcuenca La Manga, correspondiente a la región 
          hidrológica 09 Sonora Sur: conjunto de capas geoespaciales que representan 
          las líneas de flujo, puntos de drenaje, cuerpos de agua, unidad de captación 
          a nivel subcuenca y topónimos. La capa _hl representa los segmentos de la 
          red hidrográfica; _dr, los puntos de drenaje; _ha, los polígonos de cuerpos 
          de agua; _subc, el límite de la unidad de captación a nivel subcuenca; y _to, 
          los puntos con información de nombres geográficos.
        documentation:
          - "https://www.inegi.org.mx/temas/hidrografia/#mapas"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=889463135586"

        raw:
          directory: "data/raw/inegi/subc_la_manga"
          filename: "subc_la_manga.zip"

        interim:
          directory: "data/interim/inegi/subc_la_manga"
          key: "subc_la_manga"

        processed:
          directory: "data/processed/inegi/subc_la_manga"
          filename: "subc_la_manga.gpkg"
        
      subc_r_san_miguel:
        name: "Red hidrográfica. Escala 1:50 000. Edición 2.0. Subcuenca hidrográfica RH09De R. San Miguel. Cuenca R. Sonora. RH Sonora Sur"
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/hidrogeolo/subcuencas_2.0/889463136118_s.zip"
        description: >-
          Red hidrográfica de la subcuenca R. San Miguel, correspondiente a la región 
          hidrológica 09 Sonora Sur: conjunto de capas geoespaciales que representan 
          las líneas de flujo, puntos de drenaje, cuerpos de agua, unidad de captación 
          a nivel subcuenca y topónimos. La capa _hl representa los segmentos de la 
          red hidrográfica; _dr, los puntos de drenaje; _ha, los polígonos de cuerpos 
          de agua; _subc, el límite de la unidad de captación a nivel subcuenca; y _to, 
          los puntos con información de nombres geográficos.
        documentation:
          - "https://www.inegi.org.mx/temas/hidrografia/#mapas"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=889463136118"

        raw:
          directory: "data/raw/inegi/subc_r_san_miguel"
          filename: "subc_r_san_miguel.zip"

        interim:
          directory: "data/interim/inegi/subc_r_san_miguel"
