logging:
  level: "INFO"
  file: "logs/project_name.log"
  console: false

sources:
  inegi:
    name: "Instituto Nacional de Estadística y Geografía"
    url: "https://www.inegi.org.mx"
    license: "Términos de Libre Uso de la Información del INEGI: https://www.inegi.org.mx/inegi/terminos.html"
    datasets:
      denue_sonora_2024_05:
        name: "DENUE Sonora — mayo 2024"
        url: "https://www.inegi.org.mx/contenidos/masiva/denue/2024_05/denue_26_0524_csv.zip"
        description: >-
          Directorio Estadístico Nacional de Unidades Económicas de Sonora, edición mayo
          2024. Una fila por establecimiento activo: nombre y razón social, actividad
          económica (código SCIAN), tamaño por personal ocupado, domicilio (vialidad,
          colonia, código postal, AGEB y manzana), coordenadas (latitud y longitud) y
          fecha de alta. El ZIP incluye el diccionario de datos del INEGI
          (diccionario_de_datos/) y los metadatos (metadatos/). El CSV viene en
          ISO-8859-1.
        documentation:
          - "https://www.inegi.org.mx/temas/directorio/"
          - "https://www.inegi.org.mx/app/descarga/?ti=6"

        raw:
          directory: "data/raw/inegi/denue"
          filename: "denue_sonora_2024_05.zip"

        interim:
          directory: "data/interim/inegi/denue"

        processed:
          directory: "data/processed/inegi/denue"
          filename: "denue_sonora_2024_05.csv"

      dcah_2025:
        name: "Delimitación de colonias y otros asentamientos humanos 2025"
        # Solo existe como paquete nacional (~556 MB) con un ZIP por estado; con
        # descargas por rango bajamos únicamente `state_member` (~15 MB).
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/delimitaciones/794551163078_s.zip"
        state_member: "26_sonora.zip"
        description: >-
          Polígonos de colonias, fraccionamientos y otros asentamientos humanos,
          entregados y validados por cada municipio e integrados por el INEGI (en
          Hermosillo los entrega la Dirección de Catastro; actualización 11/2025). Una
          fila por asentamiento: clave geoestadística; claves de entidad, municipio,
          localidad y asentamiento; código postal; fecha de actualización; institución
          que lo entregó; nombre y tipo (colonia, fraccionamiento, residencial...).
          Proyección EPSG:6372 (Cónica Conforme de Lambert sobre ITRF2008, en metros).
          El ZIP de Sonora trae la capa 26as (shapefile), el catálogo de asentamientos
          (catalogos/, nacional, en UTF-8), la descripción de campos
          (catalogos/contenido.txt) y los metadatos (metadatos/, en ISO-8859-1).
        documentation:
          - "https://www.inegi.org.mx/programas/dcah/"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=794551163078"
          - "https://inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/nueva_estruc/889463920076.pdf"

        raw:
          directory: "data/raw/inegi/dcah"
          filename: "dcah_2025_26_sonora.zip"

        interim:
          directory: "data/interim/inegi/dcah"

      mg_2025_sonora:
        name: "Marco Geoestadístico 2025 — Sonora"
        # Paquete estatal (~73 MB) con todas las capas; bajamos por rango solo las
        # que usamos. La capa 26e son los ejes de vialidad (calles con su nombre).
        url: "https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/794551163061/26_sonora.zip"
        streets_members:
          - "conjunto_de_datos/26e.shp"
          - "conjunto_de_datos/26e.shx"
          - "conjunto_de_datos/26e.dbf"
          - "conjunto_de_datos/26e.prj"
          - "conjunto_de_datos/26e.CPG"
          # Metadato oficial del paquete de Sonora (20 KB).
          - "metadatos/mg_2025_26.txt"
        description: >-
          Ejes de vialidad (capa 26e) del Marco Geoestadístico 2025 de Sonora: una línea
          por tramo de calle. Campos: CVEGEO (clave geoestadística del tramo); CVE_ENT,
          CVE_MUN y CVE_LOC (entidad, municipio y localidad); CVEVIAL y CVESEG (claves de
          la vialidad y del segmento); NOMVIAL (nombre); TIPOVIAL (tipo: Calle, Avenida,
          Retorno...); SENTIDO y TIPOSEN (sentido de circulación) y AMBITO (urbana o
          rural). Proyección Cónica Conforme de Lambert sobre ITRF2008, en metros:
          equivale a EPSG:6372, aunque su .prj la nombra distinto. Del paquete estatal
          (~73 MB, con todas las capas) solo se descargan los archivos de esta capa y
          el metadato oficial (mg_2025_26.txt).
        documentation:
          - "https://www.inegi.org.mx/temas/mg/"
          - "https://www.inegi.org.mx/app/biblioteca/ficha.html?upc=794551163061"

        raw:
          directory: "data/raw/inegi/mg"
  bachometro:
    name: "Bachómetro Hermosillo"
    base_url: "https://bachometro.hermosillo.gob.mx"

    datasets:
      baches:
        name: "Reportes de baches de Hermosillo 2021–2026"
        url: "https://bachometro.hermosillo.gob.mx/mapa/ajax"
        years:
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026

        raw:
          directory: "data/raw/bachometro"
          filename: "baches_{year}.json"


ocr:
  device: "auto"
  output_dir: "data/external/facebook/ocr"


defaults:
  download:
    on_exists: "skip"

